[pytest]
# DeepFind — pytest configuration
# Run from the REPO ROOT after activating engine\.venv:
#   engine\.venv\Scripts\activate
#   python -m pytest
# or:
#   python -m pytest -m "not live_db"   <- fast isolated tests only

# Test discovery
testpaths = tests

# Custom markers
# Use -m "not live_db" to skip live database tests
# Use -m "live_db" to run only live database tests
markers =
    live_db: marks tests that require a live populated database (deselect with '-m "not live_db"')
    slow: marks tests that are slow (benchmark-level, deselect with '-m "not slow"')

# Default options: verbose output, show short test summary
addopts = -v --tb=short

# Minimum pytest version
minversion = 7.0
